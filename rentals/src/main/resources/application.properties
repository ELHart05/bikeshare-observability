spring.application.name=rentals
server.port=8080

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.io.github.elhart05.bikeshare=INFO

# This resolver logs the value rejected by validation at WARN. A mistyped email
# address would end up in the log in full, next to the name of the secret field.
# The 400 stays visible on the agent span: only the leak is lost.
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Human-readable console, JSON file for querying.
# trace_id and span_id come from the MDC, where the agent puts them: they stay
# empty without the agent and the rest of the line is unchanged.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{0}] %msg %kvp {trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-}}%n
logging.structured.format.file=ecs

# In-memory H2 database, recreated on every start.
spring.datasource.url=jdbc:h2:mem:rentals;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Where to reach the fleet service.
rentals.fleet-url=http://localhost:8081

# Origin allowed for the web frontend (see CorsConfig).
rentals.frontend-origin=http://localhost:4200
